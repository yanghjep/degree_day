<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>적산온도 계산기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
  <style>
    body { font-family: 'Segoe UI', 'Apple SD Gothic Neo', sans-serif; }
    .fade-in { animation: fadeIn 0.4s ease; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    select option { padding: 4px; }
  </style>
</head>
<body class="bg-gradient-to-br from-green-50 to-emerald-100 min-h-screen">

  <div class="max-w-4xl mx-auto px-4 py-10">

    <!-- Header -->
    <header class="text-center mb-8">
      <div class="text-5xl mb-3">🌸</div>
      <h1 class="text-3xl font-bold text-green-800 mb-1">적산온도 계산기</h1>
      <p class="text-green-700 text-sm">만개일부터 가까운 기상관측지점의 일평균기온(기준 0 ℃)을 누적합니다</p>
    </header>

    <!-- Input Card -->
    <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
      <h2 class="text-base font-semibold text-gray-700 mb-4">입력 정보</h2>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <!-- Date -->
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">만개일 <span class="text-red-400">*</span></label>
          <input type="date" id="startDate"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400 text-gray-800" />
        </div>

        <!-- Base temp -->
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">기준온도 (℃)</label>
          <input type="number" id="baseTemp" value="0" step="0.5"
                 class="w-full border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400 text-gray-800" />
        </div>

        <!-- Station -->
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-600 mb-1">기상관측지점 <span class="text-red-400">*</span></label>
          <div class="flex gap-2">
            <select id="stationSelect"
                    class="flex-1 border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-400 text-gray-800">
              <option value="">지점 선택...</option>
            </select>
            <button id="geoBtn"
                    class="px-4 py-2 bg-blue-500 hover:bg-blue-600 active:bg-blue-700 text-white rounded-lg transition text-sm font-medium whitespace-nowrap">
              📍 내 위치
            </button>
          </div>
          <p id="nearestInfo" class="text-xs text-blue-600 mt-1 hidden"></p>
        </div>
      </div>

      <button id="calcBtn"
              class="mt-5 w-full bg-green-600 hover:bg-green-700 active:bg-green-800 text-white font-semibold py-3 rounded-xl transition text-base">
        계산하기
      </button>
    </div>

    <!-- API key notice -->
    <div class="bg-amber-50 border border-amber-200 rounded-xl p-4 mb-6 text-sm text-amber-800">
      <strong>API 키 필요</strong>
      <a href="https://www.data.go.kr/data/15001985/openapi.do" target="_blank"
         class="underline ml-1">공공데이터포털</a>에서
      <em>기상청 지상(종관,ASOS) 일자료 조회서비스</em> API 키를 발급 받아
      <code class="bg-amber-100 px-1 rounded">.env</code> 파일에
      <code class="bg-amber-100 px-1 rounded">KMA_API_KEY=발급키</code>로 설정하세요.
    </div>

    <!-- Error -->
    <div id="errorMsg" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl p-4 mb-6 fade-in"></div>

    <!-- Loading -->
    <div id="loadingMsg" class="hidden text-center text-green-700 py-10 fade-in">
      <div class="text-4xl mb-2 animate-spin inline-block">⟳</div>
      <p>기상 데이터를 불러오는 중...</p>
    </div>

    <!-- Results -->
    <div id="results" class="hidden fade-in">

      <!-- Summary row -->
      <div class="grid grid-cols-3 gap-3 mb-6">
        <div class="bg-white rounded-2xl shadow p-4 text-center">
          <p class="text-xs text-gray-500 mb-1">관측 일수</p>
          <p id="sumDays" class="text-2xl font-bold text-green-700">-</p>
        </div>
        <div class="bg-white rounded-2xl shadow p-4 text-center">
          <p class="text-xs text-gray-500 mb-1">누적 적산온도</p>
          <p id="sumTotal" class="text-2xl font-bold text-green-700">-</p>
        </div>
        <div class="bg-white rounded-2xl shadow p-4 text-center">
          <p class="text-xs text-gray-500 mb-1">관측지점</p>
          <p id="sumStation" class="text-2xl font-bold text-green-700">-</p>
        </div>
      </div>

      <!-- Chart -->
      <div class="bg-white rounded-2xl shadow-lg p-6 mb-6">
        <h2 class="text-base font-semibold text-gray-700 mb-4">적산온도 누적 그래프</h2>
        <canvas id="chart"></canvas>
      </div>

      <!-- Table -->
      <div class="bg-white rounded-2xl shadow-lg p-6">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-base font-semibold text-gray-700">일별 상세 데이터</h2>
          <button id="exportBtn"
                  class="text-sm px-3 py-1 border border-green-500 text-green-600 rounded-lg hover:bg-green-50 transition">
            CSV 내보내기
          </button>
        </div>
        <div class="overflow-x-auto max-h-96 overflow-y-auto">
          <table class="w-full text-sm">
            <thead class="sticky top-0 bg-gray-50">
              <tr class="text-gray-500">
                <th class="px-3 py-2 text-left font-medium">날짜</th>
                <th class="px-3 py-2 text-right font-medium">일평균기온 (℃)</th>
                <th class="px-3 py-2 text-right font-medium">당일 DD</th>
                <th class="px-3 py-2 text-right font-medium">누적 적산온도</th>
              </tr>
            </thead>
            <tbody id="tableBody" class="divide-y divide-gray-100"></tbody>
          </table>
        </div>
      </div>
    </div>

  </div><!-- /container -->

<script>
// ── Station data ──────────────────────────────────────────────────────────────

];

// ── Helpers ───────────────────────────────────────────────────────────────────
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371, toR = Math.PI / 180;
  const dLat = (lat2 - lat1) * toR, dLon = (lon2 - lon1) * toR;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*toR)*Math.cos(lat2*toR)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

function findNearest(lat, lon) {
  let best = null, minD = Infinity;
  for (const s of STATIONS) {
    const d = haversine(lat, lon, s.lat, s.lon);
    if (d < minD) { minD = d; best = s; }
  }
  return { station: best, dist: Math.round(minD) };
}

// ── Populate select ───────────────────────────────────────────────────────────
const stationSelect = document.getElementById('stationSelect');
const sorted = [...STATIONS].sort((a, b) => a.name.localeCompare(b.name, 'ko'));
for (const s of sorted) {
  const opt = document.createElement('option');
  opt.value = s.id;
  opt.textContent = `${s.name} (${s.id})`;
  stationSelect.appendChild(opt);
}

// Set max date to today
document.getElementById('startDate').max = new Date().toISOString().slice(0, 10);

// ── Geolocation ───────────────────────────────────────────────────────────────
document.getElementById('geoBtn').addEventListener('click', () => {
  if (!navigator.geolocation) { alert('브라우저가 위치 정보를 지원하지 않습니다.'); return; }
  const btn = document.getElementById('geoBtn');
  btn.textContent = '탐색 중...';
  btn.disabled = true;
  navigator.geolocation.getCurrentPosition(
    ({ coords: { latitude, longitude } }) => {
      const { station, dist } = findNearest(latitude, longitude);
      stationSelect.value = station.id;
      const info = document.getElementById('nearestInfo');
      info.textContent = `현재 위치에서 가장 가까운 지점: ${station.name} (약 ${dist} km)`;
      info.classList.remove('hidden');
      btn.textContent = '📍 내 위치';
      btn.disabled = false;
    },
    (err) => {
      alert('위치 정보를 가져올 수 없습니다: ' + err.message);
      btn.textContent = '📍 내 위치';
      btn.disabled = false;
    }
  );
});

// ── Chart instance ────────────────────────────────────────────────────────────
let chartInstance = null;

// ── Calculate ─────────────────────────────────────────────────────────────────
document.getElementById('calcBtn').addEventListener('click', async () => {
  const startDate = document.getElementById('startDate').value;
  const stationId = stationSelect.value;
  const baseTemp  = parseFloat(document.getElementById('baseTemp').value) || 0;

  if (!startDate) { showError('만개일을 입력해주세요.'); return; }
  if (!stationId) { showError('기상관측지점을 선택해주세요.'); return; }

  hideError();
  setLoading(true);
  document.getElementById('results').classList.add('hidden');

  try {
    const res = await fetch('/api/degree-days', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ startDate, stationId, baseTemp }),
    });
    const json = await res.json();

    if (!res.ok || json.error) { showError(json.error || '오류가 발생했습니다.'); return; }
    if (!json.data || json.data.length === 0) { showError('해당 기간의 데이터가 없습니다.'); return; }

    renderResults(json.data, stationId);
  } catch (e) {
    showError('서버 연결 실패: ' + e.message);
  } finally {
    setLoading(false);
  }
});

// ── Render ─────────────────────────────────────────────────────────────────────
let cachedData = [];

function renderResults(data, stationId) {
  cachedData = data;
  const station = STATIONS.find(s => s.id === stationId);
  const stationName = station ? station.name : stationId;

  // Summary
  document.getElementById('sumDays').textContent    = data.length + ' 일';
  document.getElementById('sumTotal').textContent   = data[data.length-1].cumulative + ' ℃';
  document.getElementById('sumStation').textContent = stationName;

  // Chart
  const labels     = data.map(d => d.date);
  const cumulative = data.map(d => d.cumulative);
  const avgTemps   = data.map(d => d.avgTemp);

  if (chartInstance) chartInstance.destroy();
  chartInstance = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: {
      labels,
      datasets: [
        {
          label: '누적 적산온도 (℃)',
          data: cumulative,
          borderColor: '#16a34a',
          backgroundColor: 'rgba(22,163,74,0.12)',
          fill: true,
          tension: 0.35,
          pointRadius: data.length > 60 ? 0 : 3,
          yAxisID: 'y1',
        },
        {
          label: '일평균기온 (℃)',
          data: avgTemps,
          borderColor: '#f59e0b',
          borderDash: [5, 4],
          tension: 0.35,
          pointRadius: 0,
          fill: false,
          yAxisID: 'y2',
        },
      ],
    },
    options: {
      responsive: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top' },
        tooltip: {
          callbacks: { label: ctx => `${ctx.dataset.label}: ${ctx.parsed.y} ℃` },
        },
      },
      scales: {
        x: { ticks: { maxTicksLimit: 10, maxRotation: 45 } },
        y1: {
          type: 'linear', position: 'left',
          title: { display: true, text: '누적 적산온도 (℃)' },
          grid: { color: 'rgba(0,0,0,0.05)' },
        },
        y2: {
          type: 'linear', position: 'right',
          title: { display: true, text: '일평균기온 (℃)' },
          grid: { drawOnChartArea: false },
        },
      },
    },
  });

  // Table
  const tbody = document.getElementById('tableBody');
  tbody.innerHTML = '';
  for (const row of data) {
    const tr = document.createElement('tr');
    const valid = row.avgTemp !== null && row.avgTemp !== undefined;
    const tempColor = valid && row.avgTemp > 0 ? 'text-orange-600' : 'text-blue-600';
    tr.innerHTML = `
      <td class="px-3 py-2 text-gray-700">${row.date}</td>
      <td class="px-3 py-2 text-right ${tempColor}">${valid ? row.avgTemp.toFixed(1) : '-'}</td>
      <td class="px-3 py-2 text-right text-green-700">${row.degreeDay}</td>
      <td class="px-3 py-2 text-right font-semibold text-green-800">${row.cumulative}</td>
    `;
    tbody.appendChild(tr);
  }

  document.getElementById('results').classList.remove('hidden');
  document.getElementById('results').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ── CSV export ────────────────────────────────────────────────────────────────
document.getElementById('exportBtn').addEventListener('click', () => {
  if (!cachedData.length) return;
  const header = '날짜,일평균기온(℃),당일DD,누적적산온도\n';
  const rows = cachedData.map(r =>
    `${r.date},${r.avgTemp ?? ''},${r.degreeDay},${r.cumulative}`
  ).join('\n');
  const blob = new Blob(['﻿' + header + rows], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `degree_day_${document.getElementById('startDate').value}.csv`;
  a.click();
});

// ── UI helpers ────────────────────────────────────────────────────────────────
function showError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg;
  el.classList.remove('hidden');
}
function hideError() {
  document.getElementById('errorMsg').classList.add('hidden');
}
function setLoading(show) {
  document.getElementById('loadingMsg').classList.toggle('hidden', !show);
}
</script>
</body>
</html>
